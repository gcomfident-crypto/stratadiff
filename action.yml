name: StrataDiff Review Coverage (alpha)
description: Rebase-safe review-residue check inside the caller's runner; checkpoint mode requires Python 3 and has no upload step
author: StrataDiff contributors

branding:
  icon: layers
  color: green

inputs:
  base:
    description: Base revision; StrataDiff compares its merge base with head
    required: true
  head:
    description: Head revision to review
    required: true
  checkpoint:
    description: Optional commit whose complete PR change set was already reviewed
    required: false
    default: ''
  reviewer:
    description: Optional exact GitHub login whose latest completed review should become the checkpoint
    required: false
    default: ''
  github-token:
    description: GitHub token used after the build to list reviews, verify the selected commit, and fetch that exact missing checkpoint
    required: false
    default: ''
  pull-request-number:
    description: Pull request number; inferred from a pull_request event when omitted
    required: false
    default: ''
  fail-on-review-residue:
    description: Fail unless the exact checkpoint-to-head review queue is empty, including dropped or unresolved checkpoint changes
    required: false
    default: 'false'
  repository:
    description: Checked-out Git repository directory
    required: false
    default: .

outputs:
  report:
    description: Absolute path to the deterministic JSON review-focus report
    value: ${{ steps.review.outputs.report }}
  review_delta:
    description: Absolute path to the runner-local review-delta-v1 JSON artifact, or empty without a checkpoint; the action does not upload it
    value: ${{ steps.review.outputs.review_delta }}
  review_delta_schema:
    description: Versioned JSON Schema URL from the review delta artifact, or empty without a checkpoint
    value: ${{ steps.review.outputs.review_delta_schema }}
  review_delta_engine_version:
    description: StrataDiff engine version that produced the review delta artifact, or empty without a checkpoint
    value: ${{ steps.review.outputs.review_delta_engine_version }}
  checkpoint:
    description: Resolved checkpoint commit, or empty when the full PR remains in review
    value: ${{ steps.review.outputs.checkpoint }}
  checkpoint_source:
    description: explicit, github_review, or none
    value: ${{ steps.review.outputs.checkpoint_source }}
  checkpoint_record:
    description: Absolute path to the GitHub checkpoint selection record, or empty when no reviewer was resolved
    value: ${{ steps.review.outputs.checkpoint_record }}

runs:
  using: composite
  steps:
    - name: Install pinned Rust toolchain
      uses: dtolnay/rust-toolchain@49fda20b3f489226feadfba7767be1db54e2cee1 # 1.90.0
    - name: Cache the StrataDiff build
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        workspaces: ${{ github.action_path }}
    - name: Build StrataDiff without credentials
      shell: bash
      env:
        BASH_ENV: ''
        STRATADIFF_ACTION_PHASE: build
      run: |
        bash --noprofile --norc "${GITHUB_ACTION_PATH}/scripts/github_action_review.sh"
    - name: Analyze the Git range
      id: review
      shell: bash
      env:
        BASH_ENV: ''
        STRATADIFF_ACTION_PHASE: review
        STRATADIFF_BASE: ${{ inputs.base }}
        STRATADIFF_HEAD: ${{ inputs.head }}
        STRATADIFF_CHECKPOINT: ${{ inputs.checkpoint }}
        STRATADIFF_REVIEWER: ${{ inputs.reviewer }}
        STRATADIFF_GITHUB_TOKEN: ${{ inputs.github-token }}
        STRATADIFF_PULL_REQUEST_INPUT: ${{ inputs.pull-request-number }}
        STRATADIFF_FAIL_ON_REVIEW_RESIDUE: ${{ inputs.fail-on-review-residue }}
        STRATADIFF_REPOSITORY: ${{ inputs.repository }}
        STRATADIFF_GITHUB_API_URL: ${{ github.api_url }}
        STRATADIFF_GITHUB_SERVER_URL: ${{ github.server_url }}
        STRATADIFF_GITHUB_REPOSITORY: ${{ github.repository }}
        STRATADIFF_EVENT_PULL_REQUEST: ${{ github.event.pull_request.number }}
      run: |
        bash --noprofile --norc "${GITHUB_ACTION_PATH}/scripts/github_action_review.sh"
