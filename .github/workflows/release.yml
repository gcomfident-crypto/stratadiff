name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag, version, and release commit
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_commit="$(git rev-parse --verify HEAD^{commit})"
          release_version="$(scripts/check-release-tag.sh "${RELEASE_TAG}" "${release_commit}")"
          printf 'commit=%s\n' "${release_commit}" >> "${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${release_version}" >> "${GITHUB_OUTPUT}"
      - name: Create or validate draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${RELEASE_TAG}" --json isDraft >/dev/null 2>&1; then
            is_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)"
            [[ "${is_draft}" == true ]] || {
              echo "release ${RELEASE_TAG} is already published; refusing to replace it" >&2
              exit 1
            }
          else
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "StrataDiff ${RELEASE_TAG}"
          fi

  build-attest-upload:
    name: Build, attest, upload · ${{ matrix.asset }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: stratadiff-linux-x86_64
            musl: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: stratadiff-linux-aarch64
            musl: true
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: stratadiff-macos-x86_64
            musl: false
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: stratadiff-macos-arm64
            musl: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out release commit
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: test "$(git rev-parse --verify HEAD^{commit})" = "${RELEASE_COMMIT}"
      - name: Install musl linker
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: dtolnay/rust-toolchain@49fda20b3f489226feadfba7767be1db54e2cee1 # 1.90.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}
      - name: Build and validate release binary
        id: package
        env:
          CARGO_INCREMENTAL: "0"
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          case "${RELEASE_TARGET}" in
            x86_64-unknown-linux-musl|aarch64-unknown-linux-musl)
              export CC=musl-gcc
              ;;
          esac
          scripts/build-release.sh --target "${RELEASE_TARGET}" --bin stratadiff
          scripts/package-release-binary.sh \
            "${RELEASE_TARGET}" \
            "target/${RELEASE_TARGET}/release/stratadiff" \
            dist \
            "${RELEASE_TAG}" \
            "${RELEASE_COMMIT}"
      - name: Attest exact release binary
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.package.outputs.asset_name }}
          subject-digest: sha256:${{ steps.package.outputs.sha256 }}
      - name: Verify generated provenance bundle
        env:
          ASSET_PATH: ${{ steps.package.outputs.binary }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bundle_path="${ASSET_PATH}.intoto.jsonl"
          cp "${ATTESTATION_BUNDLE}" "${bundle_path}"
          gh attestation verify "${ASSET_PATH}" \
            --bundle "${bundle_path}" \
            --repo "${GITHUB_REPOSITORY}" \
            --source-ref "refs/tags/${RELEASE_TAG}" \
            --source-digest "${RELEASE_COMMIT}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
            --deny-self-hosted-runners >/dev/null
      - name: Upload the exact verified files
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.package.outputs.binary }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            "${ASSET_PATH}" \
            "${CHECKSUM_PATH}" \
            "${ASSET_PATH}.intoto.jsonl" \
            --clobber

  verify-and-publish:
    name: Verify complete release and publish
    needs: [prepare, build-attest-upload]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify every uploaded asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir release-assets
          gh release download "${RELEASE_TAG}" --dir release-assets
          scripts/verify-release-assets.sh \
            release-assets \
            "${GITHUB_REPOSITORY}" \
            "refs/tags/${RELEASE_TAG}" \
            "${RELEASE_COMMIT}" \
            "${GITHUB_REPOSITORY}/.github/workflows/release.yml"
      - name: Revalidate remote tag and publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          remote_commit="$(
            scripts/resolve-release-tag.sh "${GITHUB_REPOSITORY}" "${RELEASE_TAG}"
          )"
          if [[ "${remote_commit}" != "${RELEASE_COMMIT}" ]]; then
            echo "remote tag moved from ${RELEASE_COMMIT} to ${remote_commit}; refusing publication" >&2
            exit 1
          fi
          gh release edit "${RELEASE_TAG}" --draft=false --latest
