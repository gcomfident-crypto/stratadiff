name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gh-extension:
    name: GitHub extension · ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Test extension with system Bash
        run: PATH="/usr/bin:/bin:$PATH" /bin/bash extensions/gh-stratadiff/tests/resume_test.sh

  resume-native-macos:
    name: Native Resume · macos-latest
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@49fda20b3f489226feadfba7767be1db54e2cee1 # 1.90.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test native Resume lifecycle
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          cargo test --locked --bin stratadiff process::tests -- --test-threads=1
          cargo test --locked --bin stratadiff resume::tests -- --test-threads=1
          cargo test --locked --test resume_cli -- --test-threads=1

  web:
    name: Web · Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run notices:check
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Check embedded third-party notices
        run: cmp web/public/THIRD_PARTY_NOTICES.txt web/dist/THIRD_PARTY_NOTICES.txt
      - name: Check committed production build
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all -- web/dist)" ]]; then
            git status --short --untracked-files=all -- web/dist
            exit 1
          fi

  rust:
    name: Rust 1.90
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@49fda20b3f489226feadfba7767be1db54e2cee1 # 1.90.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install pinned license generator
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - run: scripts/ci.sh

  review-focus:
    name: Review focus · dogfood
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: stratadiff
        uses: ./
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stratadiff-review-focus
          path: ${{ steps.stratadiff.outputs.report }}
          if-no-files-found: error
