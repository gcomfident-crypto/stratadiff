[package]
name = "stratadiff"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
description = "Proof-carrying, ambiguity-aware structural code differencing"
license = "MIT"
repository = "https://github.com/gcomfident-crypto/stratadiff"
readme = "README.md"
keywords = ["diff", "ast", "tree-sitter", "structural", "code-analysis"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "3.2"
tree-sitter = "=0.27.0"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.25.0"
tree-sitter-json = "=0.24.8"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"

[dev-dependencies]
criterion = "0.8"
jsonschema = { version = "0.53", default-features = false }
proptest = "1.9"
tempfile = "3.22"

[[bench]]
name = "structural"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
