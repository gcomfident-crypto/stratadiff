[workspace]
members = [".", "crates/stratadiff-core", "crates/stratadiff-verifier"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/gcomfident-crypto/stratadiff"

[package]
name = "stratadiff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Proof-carrying, ambiguity-aware structural code differencing"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["diff", "ast", "tree-sitter", "structural", "code-analysis"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "query", "tokio"] }
base64 = "0.22"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
getrandom = "0.3"
rust-embed = { version = "8.7", features = ["debug-embed"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "3.2"
tempfile = "3.22"
tokio = { version = "1.47", features = ["net", "rt-multi-thread"] }
stratadiff-core = { version = "=0.3.0", path = "crates/stratadiff-core", default-features = false, features = ["clap"] }
stratadiff-verifier = { version = "=0.3.0", path = "crates/stratadiff-verifier" }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
criterion = "0.8"
jsonschema = { version = "0.53", default-features = false }
proptest = "1.9"
tree-sitter-java = "=0.23.5"

[[bench]]
name = "structural"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
