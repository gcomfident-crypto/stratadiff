[workspace]
members = [".", "crates/stratadiff-core", "crates/stratadiff-verifier"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/gcomfident-crypto/stratadiff"

[package]
name = "stratadiff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Exact review resume and proof-carrying structural diff for Git changes"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["code-review", "git", "diff", "tree-sitter", "code-analysis"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "query", "tokio"] }
base64 = "0.22"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
codeowner = "=0.1.0"
csv = "1.3"
ed25519-dalek = "=3.0.0"
getrandom = "0.3"
hmac = "0.12"
rust-embed = { version = "8.7", features = ["debug-embed"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "3.2"
tempfile = "3.22"
tokio = { version = "1.47", features = ["net", "rt-multi-thread", "signal", "sync", "time"] }
stratadiff-core = { version = "=0.3.0", path = "crates/stratadiff-core", default-features = false, features = ["clap"] }
stratadiff-verifier = { version = "=0.3.0", path = "crates/stratadiff-verifier" }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
criterion = "0.8"
jsonschema = { version = "0.53", default-features = false }
proptest = "1.9"
tree-sitter-java = "=0.23.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[[bench]]
name = "structural"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
